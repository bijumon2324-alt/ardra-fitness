<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access - Ardra Fitness</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
    }

    .admin-box {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      background: #1c1c1c;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255,255,255,0.08);
      text-align: center;
    }

    .admin-box h1 {
      margin-bottom: 8px;
      font-size: 28px;
    }

    .admin-box p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .admin-box input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #292929;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .admin-box button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .admin-box button:hover {
      background: #ddd;
    }

    #message {
      margin-top: 15px;
      color: #ff5555;
      display: none;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="admin-box">

    <div class="logo">🔐</div>

    <h1>Admin Access</h1>

    <p>Ardra Fitness Management</p>

    <input
      type="text"
      id="username"
      placeholder="Admin username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="message">Invalid username or password</div>

  </div>

  <script>
    function login() {

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      /*
       IMPORTANT:
       This is only a demonstration login.
       Do NOT use a real/private password here.
      */

      if (username === "admin" && password === "admin123") {

        sessionStorage.setItem("adminLoggedIn", "true");

        window.location.href = "admin-dashboard.html";

      } else {

        document.getElementById("message").style.display = "block";

      }
    }
  </script>

</body>
</html>
